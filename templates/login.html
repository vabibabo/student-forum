{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static',filename='css/login_regist.css') }}">
{% endblock %}

{% block main %}
    <form action="" method="POST" class="form-signin">
        <div class="form-container">
            <h3 class="page-title mb-3 fw-normal">Log in</h3>
            <div class="form-group form-floating">
                <input type="text" class="form-control" name="username" placeholder="Username">
                <label for="floatingInput">Username</label>
            </div>
            <div class="form-group form-floating">
                <input type="password" class="form-control" name="password" placeholder="Password">
                <label for="floatingInput">Password</label>
            </div>
            <div class="form-group"><button type="submit" class="btn btn-primary btn-block" value="Login">Login</button></div>
            <div style="text-align: center;color: red;">

                {% for message in get_flashed_messages() %}
                    <p>{{ message }}</p>
                 {% endfor %}
            </div>
        </div>
    </form>

{% endblock %}
