{% extends 'base.html' %}

{% block title %}Sign up{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static',filename='css/login_regist.css') }}">
{% endblock %}

{% block main %}
    <form action="" method="POST" class="form-signin">
        <div class="form-container">
            <h3 class="page-title mb-3 fw-normal">Sign up</h3>
            <div class="form-group form-floating">
                <input type="text" class="form-control" name="username" placeholder="User name" maxlength="30">
                <label for="floatingInput">Username</label>
            </div>
            <div class="form-group form-floating">
                <input type="password" class="form-control" name="password1" placeholder="Password" maxlength="30">
                <label for="floatingInput">Password</label>
            </div>
            <div class="form-group form-floating">
                <input type="password" class="form-control" name="password2" placeholder="Confirm password" maxlength="30">
                <label for="floatingInput">Comfirm password</label>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block w-100 btn btn-lg " value="Sign up">Sign up</button>
            </div>
            <div style="text-align: center;color: red;">

                {% for message in get_flashed_messages() %}
                    <p>{{ message }}</p>
                 {% endfor %}
            </div>
        </div>
    </form>

{% endblock %}
