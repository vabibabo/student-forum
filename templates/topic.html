{% extends 'base.html' %}

{% block title %}Topic{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static',filename='css/login_regist.css') }}">
{% endblock %}

{% block main %}
    <form action="" method="POST">
        <div class="form-container">
            <h3 class="page-title">Topic</h3>
            <div class="form-group">
                <input type="text" class="form-control" name="title" placeholder="Please write the title" maxlength="50">
            </div>
            <div class="form-group">
                <textarea rows="3" class="form-control" name="content" placeholder="Please write the content"></textarea>
            </div>
            <div class="form-group"><input type="submit" class="btn btn-primary btn-block" value="Post"></div>
        </div>
    </form>

{% endblock %}
